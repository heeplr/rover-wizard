name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      # let every combination finish, so one failure doesn't hide others
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the wizard and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # python -m pytest: always the interpreter set up above (never a system-wide pytest).
      # GitHub sets CI=true, so tests/conftest.py fails instead of skipping when a dependency is missing.
      - name: Run the tests
        run: python -m pytest -ra

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # the action stores the badge in the python-coverage-comment-action-data branch ...
      contents: write
      # ... and comments the coverage change on pull requests
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the wizard and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install pytest-cov"

      # coverage settings (source, branch coverage, relative paths) are in pyproject.toml
      - name: Run the tests with coverage
        run: python -m pytest -ra --cov

      # Pull requests from forks get a read-only token, so only same-repository events publish.
      - name: Coverage badge and pull-request comment
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 85
          MINIMUM_ORANGE: 70
