name: Release executables

# Push a version tag to build and publish:  git tag v1.0.0 && git push origin v1.0.0
# Run it by hand (Actions tab) to only build the executables, downloadable from the run's artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            executable: rover-wizard.exe
          # macos-latest runs on Apple silicon: the executable is for arm64 Macs
          - os: macos-latest
            platform: macos-arm64
            executable: rover-wizard
    defaults:
      run:
        # bash also on Windows (Git Bash), so every step is written once
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the wizard, its test dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" "pyinstaller>=6.10"

      - name: Read the version from pyproject.toml
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${{ steps.version.outputs.version }} in pyproject.toml"
            exit 1
          fi

      - name: Build the executable
        run: python -m PyInstaller --noconfirm --clean packaging/rover-wizard.spec

      - name: Package with checksum
        id: package
        run: |
          name="rover-wizard-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          mkdir -p release
          python -m zipfile -c "release/$name.zip" "dist/${{ matrix.executable }}" README.md
          python - "release/$name.zip" <<'PY'
          import hashlib, os, sys
          path = sys.argv[1]
          digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
          with open(path + ".sha256", "w", encoding="utf-8") as out:
              out.write(f"{digest}  {os.path.basename(path)}\n")
          print(digest)
          PY
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # creating the release and uploading its files
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: rover-wizard-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Single-file executables of the ArduPilot Rover setup wizard - no Python needed. Run them in a terminal.

            * **Windows**: unpack and run `rover-wizard.exe` (if SmartScreen warns about an unknown publisher,
              choose *More info* -> *Run anyway*).
            * **macOS (Apple silicon)**: unpack, then in Terminal run `xattr -d com.apple.quarantine rover-wizard`
              once (the executable is not signed) and start it with `./rover-wizard`.

            Each zip has a `.sha256` file with its checksum.
